<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1F38"/>
      <stop offset="60%" stop-color="#1B365D"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <circle cx="1050" cy="150" r="350" fill="#2563EB" opacity="0.08"/>
  <circle cx="150" cy="500" r="280" fill="#C59B27" opacity="0.06"/>
  
  <!-- Shield Badge -->
  <g transform="translate(150, 110)">
    <rect width="130" height="130" rx="30" fill="#1B365D" stroke="#C59B27" stroke-width="3" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.4))"/>
    <path d="M65 32L38 43.5V64.5C38 79.4 49.5 93 65 97C80.5 93 92 79.4 92 64.5V43.5L65 32Z" stroke="#F59E0B" stroke-width="4.5" fill="rgba(197,155,39,0.2)"/>
    <path d="M53 66L61 74L78 55" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Legal Badge -->
  <rect x="310" y="145" width="450" height="42" rx="21" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
  <text x="535" y="172" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FCD34D" text-anchor="middle">دارای مجوز رسمی از مرکز انتظام فراجا (تحت ماده ۱۲۲)</text>

  <!-- Titles -->
  <text x="150" y="320" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">تأمین نیروی نگهبان، لابی‌من و حراست فیزیکی</text>
  <text x="150" y="380" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#goldAccent)">دیدبان امین توانا — شماره ثبت ۵۵۳۵۶</text>
  <text x="150" y="440" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="22" font-weight="normal" fill="#CBD5E1">حذف ۱۰۰٪ ریسک شکایت سنوات، پوشش کامل بیمه، تعهد جایگزینی زیر ۴ ساعت</text>

  <!-- Bottom Badges -->
  <g transform="translate(150, 490)">
    <rect width="210" height="56" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <text x="105" y="35" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">🏢 لابی‌من تشریفاتی برج</text>
    
    <rect x="230" y="0" width="220" height="56" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <text x="340" y="35" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">🏭 حراست کارخانه و انبار</text>

    <rect x="470" y="0" width="220" height="56" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <text x="580" y="35" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">🏗️ نگهبان کارگاه عمرانی</text>

    <rect x="710" y="0" width="200" height="56" rx="14" fill="#C59B27"/>
    <text x="810" y="35" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="16" font-weight="900" fill="#0F1F38" text-anchor="middle">۰۲۱-۴۴۲۸۹۰۰۰</text>
  </g>
</svg>
